name: $(Date:yyyyMMdd)$(Rev:.r)

# Azure Static Web Apps CI/CD - static export deploy.
# We build explicitly (npm ci + next build with output: "export") and hand the
# finished `out/` folder to the deploy task with skip_app_build, so Oryx never
# tries to auto-detect/re-build the Next app as an SSR/hybrid deployment.

pr:
  branches:
    include:
      - main
trigger:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-delightful-meadow-04351e600-variable-group
  steps:
  - checkout: self
    submodules: true

  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build static export (next build -> out/)
    env:
      DEPLOY_TARGET: azure-static

  - task: AzureStaticWebApp@0
    displayName: Deploy to Azure Static Web Apps
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_MEADOW_04351E600)
      app_location: "out"      # pre-built static output
      api_location: ""         # no API
      output_location: ""      # app_location already holds the built content
      skip_app_build: true     # do not let Oryx build; we built above
      skip_api_build: true
